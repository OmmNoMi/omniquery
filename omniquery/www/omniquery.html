<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>{{ title or "OmniQuery · OmmNoMi Field Survey Platform" }}</title>

  <!-- Pass Session, CSRF Token & Frappe Native Translations to Frontend PWA -->
  <script>
    window.frappe = window.frappe || {};
    window.frappe.csrf_token = "{{ csrf_token or frappe.session.data.csrf_token or '' }}";
    window.frappe.user = "{{ current_user or frappe.session.user or '' }}";
    window.frappe.initial_survey_id = "{{ initial_survey_id or '' }}";
    window.frappe.initial_project_id = "{{ initial_project_id or '' }}";
    window.__messages = {{ translations or '{}' }};
    window.__ = function(txt) {
      return (window.__messages && window.__messages[txt]) || txt;
    };
  </script>

  <!-- Instant Theme & Text Scale Initializer to prevent layout shift -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('omniquery_theme') || 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
        var s = localStorage.getItem('omniquery_text_size') || 'md';
        document.documentElement.classList.add('text-scale-' + s);
      } catch (e) {}
    })();
  </script>

  <!-- PWA Metadata & Theme -->
  <meta name="theme-color" content="#15803d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OmniQuery">
  <link rel="manifest" href="/assets/omniquery/pwa/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/omniquery/icons/desktop_icons/solid/omniquery.svg">
  <link rel="apple-touch-icon" href="/assets/omniquery/pwa/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/omniquery/pwa/icon-192.png">

  <!-- Production Pre-Compiled Tailwind & Frappe UI Stylesheet (Zero CDN) -->
  <link rel="stylesheet" href="/assets/omniquery/dist/omniquery.bundle.css?v={{ bundle_version or '20260930_1355' }}">
  <style>
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    #app {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen">
  
  <div id="app">
    <!-- Instant PWA Loading Splash Screen (Shows OmniQuery Logo before JS boots) -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f1f5f9; padding: 1.5rem; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="position: relative; margin-bottom: 1.25rem;">
        <img
          src="/assets/omniquery/icons/desktop_icons/solid/omniquery.svg"
          alt="OmniQuery"
          width="76"
          height="76"
          style="border-radius: 1.25rem; box-shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.1); display: block;"
          onerror="this.onerror=null; this.src='/assets/omniquery/pwa/icon-192.png';"
        />
        <div style="position: absolute; bottom: -4px; right: -4px; width: 18px; height: 18px; border-radius: 9999px; background-color: #10b981; border: 3px solid #f1f5f9;"></div>
      </div>
      <h1 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 0 0 0.25rem 0; letter-spacing: -0.025em;">
        OmniQuery
      </h1>
      <p style="font-size: 0.8125rem; font-weight: 600; color: #047857; margin: 0 0 1.5rem 0; text-transform: uppercase; letter-spacing: 0.05em;">
        Field Intelligence & Survey Platform
      </p>
      <div style="display: flex; align-items: center; gap: 0.5rem; color: #64748b; font-size: 0.8125rem; font-weight: 500;">
        <div style="width: 14px; height: 14px; border: 2px solid #10b981; border-top-color: transparent; border-radius: 9999px; animation: spin 0.8s linear infinite;"></div>
        <span>Initializing offline cache...</span>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>

  <!-- Production Pre-Compiled Vue 3 + Frappe UI + Dexie Application Bundle -->
  <script src="/assets/omniquery/dist/omniquery.bundle.js?v={{ bundle_version or '20260930_1355' }}"></script>



  <!-- Service Worker Registration for Complete Offline Capability -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(() => navigator.serviceWorker.register('/assets/omniquery/pwa/sw.js'))
          .then(reg => reg && console.log('OmniQuery SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
