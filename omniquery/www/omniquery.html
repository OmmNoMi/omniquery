<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>{{ title or "OmniQuery · OmmNoMi Field Survey Platform" }}</title>
  <script>
    window.frappe = window.frappe || {};
    window.frappe.csrf_token = "{{ csrf_token or frappe.session.data.csrf_token or '' }}";
    window.frappe.user = "{{ current_user or frappe.session.user or '' }}";
    window.frappe.initial_survey_id = "{{ initial_survey_id or '' }}";
    window.frappe.initial_project_id = "{{ initial_project_id or '' }}";
    window.__messages = {{ translations or '{}' }};
    window.__ = function(txt) { return (window.__messages && window.__messages[txt]) || txt; };
  </script>
  <meta name="theme-color" content="#15803d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OmniQuery">
  <link rel="manifest" href="/assets/omniquery/pwa/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/omniquery/icons/desktop_icons/solid/omniquery.svg">
  <link rel="apple-touch-icon" href="/assets/omniquery/pwa/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/omniquery/pwa/icon-192.png">
  <link rel="stylesheet" href="/assets/omniquery/dist/omniquery.bundle.css?v={{ bundle_version or '20260930_1950' }}">
  <style>html, body, #app { width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen">
  <div id="app"></div>
  <script src="/assets/omniquery/dist/omniquery.bundle.js?v={{ bundle_version or '20260930_1950' }}"></script>
</body>
</html>
